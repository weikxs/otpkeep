# Product and protocol names that are words, not code identifiers, in doc comments.
doc-valid-idents = ["OTPKeep", "GitHub", "WebView", "..", "TOTP", "HOTP", "MigrationPayload", "OtpParameters", "GoldenPassport", "NSKeyedArchiver", "CoreBluetooth", "FreeOTP"]

# Tests may fail loudly: a panic in a test is a failed assertion, not a crash in production.
allow-panic-in-tests = true
allow-unwrap-in-tests = true
allow-expect-in-tests = true
