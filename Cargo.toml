[workspace]
resolver = "3"
members = ["crates/*", "apps/cli", "apps/desktop-mobile/src-tauri"]
default-members = ["crates/*", "apps/cli", "apps/desktop-mobile/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/weikxs/otpkeep"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
module_name_repetitions = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# rqrr 0.11.0 with a fix for upstream issue #54 (vendor/rqrr/OTPKEEP-PATCH.md).
[patch.crates-io]
rqrr = { path = "vendor/rqrr" }
