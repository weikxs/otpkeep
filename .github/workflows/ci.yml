name: CI

# One job per pull request, on Linux: privacy, format, dependency policy and
# advisories, clippy, the tests with coverage, and the interface's type check,
# component and browser tests, one after another. A change to documentation
# alone finishes in seconds without running them; a draft runs nothing.
# Merging to main starts nothing, since the pull request was already tested.
# macOS and Windows, the iOS and Android builds, the installer size and
# fuzzing are in full.yml, started by hand before a release; the release workflow runs every check
# again before it publishes anything. Branch rules require this job, `check`.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  UI_DIR: apps/desktop-mobile

jobs:
  check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: What changed
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only "$BASE"...HEAD)
          printf '%s\n' "$files"
          docs='\.md$|^docs/|^LICENSE|^\.github/(ISSUE_TEMPLATE|release-notes)/|^\.github/(CODEOWNERS|pull_request_template\.md)$'
          if printf '%s\n' "$files" | grep -Ev "$docs" | grep -q .; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = false ]; then echo "documentation only: nothing to test"; fi
      - name: Privacy
        if: steps.diff.outputs.code == 'true'
        run: scripts/check-privacy.sh
      - if: steps.diff.outputs.code == 'true'
        uses: ./.github/actions/setup
      - if: steps.diff.outputs.code == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit,cargo-llvm-cov
      - name: Format, dependency policy, advisories, clippy
        if: steps.diff.outputs.code == 'true'
        run: make fmt-check deny audit clippy
      - name: Tests with coverage (at least 80%)
        if: steps.diff.outputs.code == 'true'
        run: make cover
      - name: Interface type check and component tests
        if: steps.diff.outputs.code == 'true'
        working-directory: ${{ env.UI_DIR }}
        run: pnpm typecheck && pnpm test
      - name: Browser tests (Chrome)
        if: steps.diff.outputs.code == 'true'
        working-directory: ${{ env.UI_DIR }}
        run: pnpm e2e
