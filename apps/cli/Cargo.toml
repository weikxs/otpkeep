[package]
name = "otpkeep-cli"
description = "The otpkeep command-line tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "otpkeep"
path = "src/main.rs"

[dependencies]
tracing = "0.1"
keep-find = { path = "../../crates/keep-find" }
keep-keyuri = { path = "../../crates/keep-keyuri" }
keep-passcode = { path = "../../crates/keep-passcode" }
keep-platform = { path = "../../crates/keep-platform" }
keep-transfer = { path = "../../crates/keep-transfer" }
keep-vault = { path = "../../crates/keep-vault" }
rpassword = "7.5"
serde_json = "1.0"
zeroize = "1.9"

[dev-dependencies]
tempfile = "3.27"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[lints]
workspace = true
