[package]
name = "otpkeep-app"
description = "The OTPKeep app for desktop and mobile."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# A distinct library name avoids a clash with the binary name on Windows.
name = "otpkeep_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
keep-find = { path = "../../../crates/keep-find" }
keep-gate = { path = "../../../crates/keep-gate" }
keep-keyuri = { path = "../../../crates/keep-keyuri" }
keep-passcode = { path = "../../../crates/keep-passcode" }
keep-platform = { path = "../../../crates/keep-platform" }
keep-sync = { path = "../../../crates/keep-sync" }
keep-transfer = { path = "../../../crates/keep-transfer" }
keep-vault = { path = "../../../crates/keep-vault" }
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.9", features = ["tray-icon"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
zeroize = "1.9"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = { version = "3", default-features = false }
# Typing a code into the focused field (FR-5.5); X11 through the pure-Rust x11rb.
enigo = "0.6"
keep-link = { path = "../../../crates/keep-link" }
sys-locale = "0.3"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true
