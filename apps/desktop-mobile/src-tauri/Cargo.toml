[package]
name = "otpkeep-app"
description = "The OTPKeep app for desktop and mobile."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# A distinct library name avoids a clash with the binary name on Windows.
name = "otpkeep_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
keep-find = { path = "../../../crates/keep-find" }
keep-passcode = { path = "../../../crates/keep-passcode" }
keep-platform = { path = "../../../crates/keep-platform" }
keep-vault = { path = "../../../crates/keep-vault" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.9", features = ["tray-icon"] }
thiserror = "2"
zeroize = "1.9"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = { version = "3", default-features = false }

[dev-dependencies]
serde_json = "1"
tempfile = "3.27"

[lints]
workspace = true
