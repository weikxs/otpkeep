[package]
name = "keep-transfer"
description = "Import and export: encrypted backups, Google Authenticator migration codes and QR codes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23"
getrandom = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
keep-keyuri = { path = "../keep-keyuri" }
keep-passcode = { path = "../keep-passcode" }
keep-vault = { path = "../keep-vault" }
percent-encoding = "2.3"
plist = "1.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rqrr = { version = "0.11", default-features = false }
serde_json = "1.0"
thiserror = "2"
zeroize = "1.9"

[dev-dependencies]
proptest = "1.12"

[lints]
workspace = true
