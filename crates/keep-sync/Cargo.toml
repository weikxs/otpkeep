[package]
name = "keep-sync"
description = "LAN pairing and sync: windows, handshakes, membership and merging."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8"
ciborium = "0.2"
ed25519-dalek = "3.0"
getrandom = "0.4"
hkdf = "0.12"
hmac = "0.12"
keep-passcode = { path = "../keep-passcode" }
keep-vault = { path = "../keep-vault" }
sha2 = "0.11"
snow = "0.10"
spake2 = "=0.4.0"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "time", "rt", "macros", "sync"] }
tracing = "0.1"
x25519-dalek = { version = "3.0", features = ["static_secrets"] }
zeroize = "1.9"

[lints]
workspace = true

[dev-dependencies]

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
mdns-sd = { version = "0.21", default-features = false, features = ["async"] }
netdev = "0.46"
