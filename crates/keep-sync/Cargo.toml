[package]
name = "keep-sync"
description = "LAN pairing and sync: windows, handshakes, membership and merging."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8"
ciborium = "0.2"
ed25519-dalek = "3.0"
getrandom = "0.4"
keep-vault = { path = "../keep-vault" }
thiserror = "2"
tracing = "0.1"
x25519-dalek = { version = "3.0", features = ["static_secrets"] }
zeroize = "1.9"

[lints]
workspace = true

[dev-dependencies]
keep-passcode = { path = "../keep-passcode" }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
netdev = "0.46"
