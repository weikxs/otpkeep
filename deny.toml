# Dependency policy, checked by `make deny` and CI.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Unmaintained (not a vulnerability), pulled in by Tauri's Linux GTK stack. Tracked as DEBT-001.
  { id = "RUSTSEC-2024-0370", reason = "transitive via tauri -> gtk 0.18; no alternative until Tauri moves to gtk4" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses only. No GPL-family licenses, so the project's own license stays an open choice.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
]

# MPL-2.0 is file-level copyleft and stays compatible with any project license when the files are
# unmodified. Allow it only for these crates, which come from Tauri's HTML and CSS handling.
exceptions = [
  { crate = "cssparser", allow = ["MPL-2.0"] },
  { crate = "cssparser-macros", allow = ["MPL-2.0"] },
  { crate = "dtoa-short", allow = ["MPL-2.0"] },
  { crate = "option-ext", allow = ["MPL-2.0"] },
  { crate = "selectors", allow = ["MPL-2.0"] },
]

[licenses.private]
# Our own crates are unpublished and the project license is not chosen yet.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
